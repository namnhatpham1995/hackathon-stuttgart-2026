allowBuilds:
  esbuild: true
  sharp: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  # @google/genai depends on protobufjs, whose postinstall is not needed at runtime
  # (the client ships generated code). Name it so pnpm install does not stop.
  protobufjs: false

# Keep Linux native binaries in the lockfile even when it is regenerated on Windows or macOS, so a
# Linux host (CI, Railway, Vercel) can install with --frozen-lockfile.
supportedArchitectures:
  os: [current, linux]
  cpu: [current, x64]
  libc: [current, glibc]

overrides:
  # drizzle-kit's deprecated @esbuild-kit loader pins an esbuild with GHSA-67mh-4wv8-2f99 (dev
  # server request forgery); move only that vulnerable range to a patched release.
  "esbuild@<0.24.3": "0.25.12"
