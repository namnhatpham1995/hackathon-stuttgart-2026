# A fixed project name, so `docker compose up` from any git worktree reaches this one container
# instead of starting a second one on the same port.
name: hackathon-stuttgart-2026

services:
  db:
    image: postgres:16
    # Local throwaway data only: no fsync, so tests do not wait for the disk.
    command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    environment:
      POSTGRES_DB: hackathon
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # 5434, not 5432, so it never collides with another local PostgreSQL.
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hackathon"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - hackathon-postgres-data:/var/lib/postgresql/data

volumes:
  hackathon-postgres-data:
